services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: fincontrol
      POSTGRES_PASSWORD: fincontrol_local
      POSTGRES_DB: fincontrol
    volumes:
      - dados:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fincontrol -d fincontrol"]
      interval: 3s
      timeout: 3s
      retries: 20
  api:
    build: .
    environment:
      DATABASE_URL: postgresql://fincontrol:fincontrol_local@db:5432/fincontrol
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      db:
        condition: service_healthy
volumes:
  dados:
